name: WiFi Presence Scanner
slug: wifi_presence_scanner
description: Continuously scans nearby WiFi networks and emits Home Assistant automation events.
version: 1.0.1
url: https://github.com/robertlangbein/hassio-wifi-scanner
arch:
  - aarch64
  - amd64
  - armv7
  - i386
  - armhf
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:wifi-marker
panel_title: WiFi Scanner
hassio_api: true
hassio_role: default
homeassistant_api: true
map:
  - addon_config:rw
  - ssl:ro
options:
  wifi_interface: wlan0
  log_level: info
  scan_interval_sec: 30
  disappear_missed_scans: 2
  retention_days: 30
  privacy_mode: false
  privacy_salt: ""
  quiet_windows_json: "[]"
  ignore_ssid_patterns: ""
  ignore_bssid_prefixes: ""
schema:
  wifi_interface: str
  log_level: match(^(error|warning|info|debug)$)
  scan_interval_sec: int
  disappear_missed_scans: int
  retention_days: int
  privacy_mode: bool
  privacy_salt: str?
  quiet_windows_json: str?
  ignore_ssid_patterns: str?
  ignore_bssid_prefixes: str?
